[package]
name = "oscilo"
version = "0.6.1"
description = "Oscilo – análise de oscilografias COMTRADE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "oscilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
