<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oscilografias COMTRADE</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <nav class="mode-tabs" role="tablist">
        <button type="button" class="mode-tab active" data-mode="osc" role="tab">Oscilografia</button>
        <button type="button" class="mode-tab" data-mode="prot" role="tab">Proteção</button>
      </nav>
      <div class="toolbar-group">
        <label class="btn file-btn">
          Abrir COMTRADE
          <input type="file" id="file-input" accept=".cfg,.CFG,.dat,.DAT" multiple hidden />
        </label>
        <button type="button" id="open-native" class="btn hidden" title="Abrir um arquivo .cfg do computador (o .dat é lido da mesma pasta)">Abrir…</button>
        <select id="recent-select" class="select select-recent hidden" title="Abertos recentemente">
          <option value="">Recentes…</option>
        </select>
        <select id="sample-select" class="select" title="Oscilografias de exemplo">
          <option value="">Exemplos…</option>
        </select>
        <button type="button" id="open-merge" class="btn" title="Juntar oscilografias de terminais diferentes numa base de tempo comum">Juntar registros</button>
      </div>
      <div class="toolbar-group osc-only">
        <button id="zoom-in" class="btn" title="Zoom in">+</button>
        <button id="zoom-out" class="btn" title="Zoom out">−</button>
        <button id="zoom-fit" class="btn" title="Ajustar à janela">Ajustar</button>
        <button id="zoom-selection" class="btn" title="Zoom na seleção">Zoom seleção</button>
      </div>
      <div class="toolbar-group osc-only">
        <label class="toggle">
          <input type="radio" name="layout" value="stacked" checked />
          Faixas separadas
        </label>
        <label class="toggle">
          <input type="radio" name="layout" value="overlay" />
          Faixa única
        </label>
      </div>
      <div class="toolbar-group osc-only">
        <button id="toggle-dock" class="btn btn-toggle active" title="Mostrar/ocultar painel de análises">Análises</button>
      </div>
      <div class="toolbar-group markers-group osc-only">
        <button id="add-marker" class="btn" title="Adicionar marcador no cursor">+ Marcador</button>
        <button id="clear-markers" class="btn" title="Limpar marcadores">Limpar</button>
      </div>
      <div class="toolbar-group cursors-group osc-only">
        <button id="set-c1" class="btn btn-c1" title="Fixar o cursor C1 na posição do mouse (tecla 1). Arraste a linha para ajustar.">C1</button>
        <button id="set-c2" class="btn btn-c2" title="Fixar o cursor C2 na posição do mouse (tecla 2). Arraste a linha para ajustar.">C2</button>
        <button id="clear-cursors" class="btn" title="Remover C1 e C2">×</button>
      </div>
      <div class="toolbar-group">
        <button id="open-report" class="btn" title="Gerar relatório (Word, HTML ou PDF)">Relatório</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Canais</h2>
          <div class="sidebar-actions">
            <button id="select-all-analog" class="link-btn">Analógicos</button>
            <button id="clear-selection" class="link-btn">Limpar</button>
          </div>
        </div>
        <div id="record-info" class="record-info"></div>
        <nav class="side-tabs" role="tablist">
          <button type="button" class="side-tab active" data-pane="analog">Analógicos <span class="side-count" id="count-analog"></span></button>
          <button type="button" class="side-tab" data-pane="digital">Digitais <span class="side-count" id="count-digital"></span></button>
          <button type="button" class="side-tab" data-pane="phasor" id="tab-phasor" disabled>Fasores</button>
        </nav>
        <div class="channel-section side-pane active" data-pane="analog">
          <input type="search" id="analog-search" class="channel-search" placeholder="Buscar canal analógico…" />
          <div id="analog-channels" class="channel-list"></div>
        </div>
        <div class="channel-section side-pane" data-pane="digital">
          <input type="search" id="digital-search" class="channel-search" placeholder="Buscar canal digital…" />
          <div id="digital-channels" class="channel-list"></div>
        </div>
        <div class="channel-section side-pane phasor-section hidden" data-pane="phasor" id="phasor-section">
          <div class="phasor-controls">
            <p id="no-groups-hint" class="phasor-hint hidden">Nenhum conjunto trifásico reconhecido pelos nomes dos canais. Defina um grupo manualmente.</p>
            <p id="rotation-hint" class="phasor-hint hidden"></p>
            <label class="phasor-field">
              Tensão
              <select id="voltage-group" class="select phasor-select"></select>
            </label>
            <label class="phasor-field">
              Corrente
              <select id="current-group" class="select phasor-select"></select>
            </label>
            <label class="phasor-field">
              Janela
              <select id="window-cycles" class="select phasor-select">
                <option value="0.5">½ ciclo</option>
                <option value="1">1 ciclo</option>
                <option value="2">2 ciclos</option>
                <option value="4">4 ciclos</option>
              </select>
            </label>
            <label class="phasor-field">
              Estimador
              <select id="estimator" class="select phasor-select"></select>
            </label>
            <div class="group-actions">
              <button type="button" id="add-group" class="btn btn-sm">+ Grupo trifásico</button>
              <button type="button" id="remove-group" class="link-btn hidden" title="Remove os grupos manuais selecionados">Remover manual</button>
            </div>
          </div>
          <div id="derived-metrics-list" class="derived-metrics-list"></div>
        </div>
      </aside>

      <section class="viewer">
        <div class="ruler-container">
          <div class="track-gutter"></div>
          <div class="ruler-wrap">
            <canvas id="ruler-canvas"></canvas>
            <div id="selection-overlay" class="selection-overlay hidden"></div>
          </div>
        </div>
        <div id="tracks-container" class="tracks-container">
          <div class="empty-state" id="empty-state">
            <p>Abra um arquivo COMTRADE (.cfg + .dat) ou selecione um exemplo disponível.</p>
          </div>
        </div>
        <div id="nav-scroll-bar" class="nav-scroll-bar hidden">
          <div class="track-gutter"></div>
          <div class="nav-scroll-wrap">
            <input type="range" id="nav-scroll" min="0" max="1000" value="0" step="1" title="Navegar no tempo" />
          </div>
        </div>
      </section>

      <aside id="analysis-dock" class="analysis-dock">
        <div class="dock-resizer" title="Arraste para redimensionar"></div>
        <div class="dock-inner">
          <nav class="dock-tabs"></nav>
          <div class="dock-body"></div>
          <div id="phasor-panel" class="phasor-panel hidden">
            <button type="button" class="phasor-panel-header" title="Recolher/expandir">Grandezas no cursor <span class="pp-toggle">▾</span></button>
            <div id="phasor-table-wrap" class="phasor-table-wrap"></div>
          </div>
        </div>
      </aside>
    </div>

    <div id="protection-view" class="protection-view hidden"></div>

    <dialog id="group-dialog" class="group-dialog">
      <form method="dialog">
        <h3>Novo grupo trifásico</h3>
        <label>Grandeza
          <select name="quantity" class="select">
            <option value="V">Tensão (Va, Vb, Vc)</option>
            <option value="I">Corrente (Ia, Ib, Ic)</option>
          </select>
        </label>
        <label>Nome <input name="label" class="an-input" maxlength="60" placeholder="ex.: LT 500 kV – Terminal X" /></label>
        <label>Fase A <select name="a" class="select"></select></label>
        <label>Fase B <select name="b" class="select"></select></label>
        <label>Fase C <select name="c" class="select"></select></label>
        <p class="dlg-error"></p>
        <div class="dlg-actions">
          <button value="cancel" class="btn" formnovalidate>Cancelar</button>
          <button value="ok" class="btn btn-primary">Criar grupo</button>
        </div>
      </form>
    </dialog>

    <dialog id="report-dialog" class="group-dialog report-dialog">
      <form method="dialog" autocomplete="off">
        <h3>Relatório de análise</h3>
        <label>Título <input name="title" class="an-input" maxlength="200" /></label>
        <div class="rp-row">
          <label>Ocorrência <input name="occurrence" class="an-input" maxlength="200" placeholder="nº / equipamento" /></label>
          <label>Analista <input name="analyst" class="an-input" maxlength="120" /></label>
        </div>
        <label>Comentários / análise <textarea name="comments" class="an-input rp-text" rows="4" maxlength="20000" placeholder="Descrição da sequência, comportamento da proteção… (linha em branco separa parágrafos)"></textarea></label>
        <label>Conclusão <textarea name="conclusion" class="an-input rp-text" rows="2" maxlength="20000" placeholder="Ex.: atuação correta e seletiva."></textarea></label>
        <fieldset class="rp-sections">
          <legend>Incluir</legend>
          <label><input type="checkbox" name="s_summary" checked /> Resumo da perturbação</label>
          <label><input type="checkbox" name="s_protection" checked /> Atuação da proteção</label>
          <label><input type="checkbox" name="s_events" checked /> Sequência de eventos</label>
          <label><input type="checkbox" name="s_cursors" checked /> Medições C1/C2</label>
          <label><input type="checkbox" name="fig_view" checked /> Figura: oscilografia visível</label>
          <label><input type="checkbox" name="fig_dock" /> Figura: gráfico da aba de análise aberta</label>
        </fieldset>
        <p class="rp-hint muted"></p>
        <p class="dlg-error"></p>
        <div class="dlg-actions">
          <button value="cancel" class="btn" formnovalidate>Fechar</button>
          <button value="print" class="btn" title="Abre a impressão – escolha &quot;Salvar como PDF&quot;">Imprimir / PDF</button>
          <button value="html" class="btn">HTML</button>
          <button value="docx" class="btn btn-primary">Word (.docx)</button>
        </div>
      </form>
    </dialog>


    <footer class="statusbar">
      <span id="status-position">Posição: —</span>
      <span id="status-selection">Seleção: —</span>
      <span id="status-zoom">Zoom: 100%</span>
      <span id="status-markers">Marcadores: 0</span>
      <span id="status-cursors">C1/C2: teclas 1 e 2</span>
    </footer>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
