name: Release

# A cada tag v* (ex.: v0.6.1) gera e anexa a um Release em rascunho:
#   Windows  Oscilo_<v>_x64-setup.exe (instalador) e Oscilo_<v>_x64-portable.zip (portátil)
#   Linux    .deb e .AppImage          macOS (Apple Silicon)  .dmg
#   Web      Oscilo_<v>_web.zip (servidor + navegador; requer Python)
# Revise o rascunho em Releases e publique. Também pode ser disparado
# manualmente (Actions → Release → Run workflow): os arquivos ficam em Artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências Linux (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Testes do backend
        run: |
          pip install -r backend/requirements.txt pytest pyinstaller
          python -m pytest -q backend/tests

      - name: Empacota o servidor (PyInstaller)
        run: pyinstaller desktop/oscilo-server.spec --noconfirm --distpath build --workpath build/pyinstaller

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}
          releaseName: "Oscilo ${{ github.ref_name }}"
          releaseBody: |
            **Windows**
            - `Oscilo_x.y.z_x64-setup.exe` – instalador (só para o usuário, sem administrador)
            - `Oscilo_x.y.z_x64-portable.zip` – portátil: extraia e execute `Oscilo.exe`

            **Linux**: `.AppImage` (portátil) ou `.deb` · **macOS (Apple Silicon)**: `.dmg`

            **Web**: `Oscilo_x.y.z_web.zip` – roda no navegador; requer Python 3.10+ (`iniciar.bat` / `iniciar.sh`)
          releaseDraft: true

      - name: Versão portátil (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path portable\Oscilo | Out-Null
          Copy-Item src-tauri\target\release\oscilo.exe portable\Oscilo\Oscilo.exe
          Copy-Item -Recurse build\server portable\Oscilo\server
          Copy-Item LICENSE portable\Oscilo
          Compress-Archive -Path portable\Oscilo -DestinationPath "Oscilo_${version}_x64-portable.zip"
          "PORTABLE=Oscilo_${version}_x64-portable.zip" >> $env:GITHUB_ENV

      - name: Anexa a versão portátil ao Release
        if: runner.os == 'Windows' && env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.PORTABLE }}" --clobber

      - name: Artefatos (execução manual)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oscilo-${{ matrix.platform }}
          path: |
            Oscilo_*_x64-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  web:
    needs: desktop # o Release (rascunho) já existe quando este job roda
    if: ${{ !cancelled() }} # publica a versão web mesmo se uma plataforma desktop falhar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pacote web
        run: python scripts/package_web.py --out dist
      - name: Anexa ao Release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.zip --clobber
      - name: Artefato (execução manual)
        if: env.IS_TAG != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oscilo-web
          path: dist/*.zip
